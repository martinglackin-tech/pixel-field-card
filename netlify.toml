# Static site: no build step, publish the repo root.
[build]
  publish = "."
  # Netlify only redirects to Cloudflare now, so skip every build: pushes deploy to Cloudflare only
  # and Netlify keeps serving the redirect from its last deploy.
  ignore = "exit 0"

# Browsers must always check for a new service worker and manifest, so updates show on the next load.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# The app moved to Cloudflare: https://pixel-field-card.martinglackin.workers.dev/
# Installed copies still check sw.js, so serve a worker that clears the old offline copy and removes itself.
[[redirects]]
  from = "/sw.js"
  to = "/retire-sw.js"
  status = 200
  force = true

# Everything else goes to the new address.
[[redirects]]
  from = "/*"
  to = "https://pixel-field-card.martinglackin.workers.dev/:splat"
  status = 301
  force = true
